name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  netlify:
    name: Netlify production deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy to Netlify if a token is configured
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 114a2783-3747-4f2e-bcd4-399ddf0c15dc
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            npx --yes netlify-cli api updateSite --data '{"stop_builds":false}' --site-id "$NETLIFY_SITE_ID" || true
            npx --yes netlify-cli deploy --dir=. --prod --site "$NETLIFY_SITE_ID" --message "GitHub Actions: offer intel live"
          else
            echo "NETLIFY_AUTH_TOKEN is not set. Relying on Netlify Git integration."
          fi
      - name: Verify canonical production
        run: |
          set -e
          JS="$(curl -fsS 'https://cheap-ticket-finder.vercel.app/js/booking-links.js')"
          HTML="$(curl -fsS 'https://cheap-ticket-finder.vercel.app/')"
          echo "$HTML$JS" | grep -q 'sharetrip.net/flight/search' && {
            echo "LIVE still contains sharetrip.net/flight/search"
            exit 1
          }
          echo "$HTML$JS" | grep -Eq 'gozayaan.com/campaign/sc|bracbank.com/en/offers|AIRASTRA15' || {
            echo "LIVE missing official BD bank/card or promo intel"
            exit 1
          }
          echo "Live HTML/JS looks current"
        continue-on-error: true
