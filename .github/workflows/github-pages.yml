name: GitHub Pages

# Optional public fallback. Canonical URL is Netlify.
# GITHUB_TOKEN cannot enable Pages; skip cleanly until the owner turns it on.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  probe:
    name: Pages enabled?
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages" || true)
          echo "pages HTTP ${code}"
          if [ "${code}" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub Pages is not enabled; skipping deploy. Canonical host is https://global-travel-tracker.netlify.app"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Publish static site
    needs: probe
    if: needs.probe.outputs.enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage publishable files
        run: |
          mkdir -p _site/js
          cp index.html .nojekyll PRODUCTION_SHIP.txt _site/
          cp js/booking-links.js _site/js/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
