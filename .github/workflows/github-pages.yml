name: GitHub Pages

# Public fallback while Netlify production auto-publishing is stopped.
# Live canonical URL remains https://global-travel-tracker.netlify.app
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish static site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage publishable files
        run: |
          mkdir -p _site/js
          cp index.html .nojekyll PRODUCTION_SHIP.txt _site/
          cp js/booking-links.js _site/js/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
