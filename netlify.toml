[build]
  command = "echo shipping-structured-links && true"
  publish = "."
  # Never skip: production deploys after PR merges were skipped (state=error, skipped=true).
  ignore = "exit 1"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Deploy-Stamp = "structured-links-2026-09-01-main"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Deploy-Stamp = "structured-links-2026-09-01-main"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Deploy-Stamp = "structured-links-2026-09-01-main"
